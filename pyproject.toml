[project]
name = "clinic-agent"
version = "0.1.0"
description = "AI voice agent for clinic appointment scheduling (Telnyx + Gemini Live)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "asyncpg>=0.30",
    "google-genai>=0.8",
    "numpy>=2.1",
    "scipy>=1.14",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "pynacl>=1.5",
    "tzdata>=2024.2",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "time-machine>=2.15",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_agent"]
